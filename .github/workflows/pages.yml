name: Página do TeleZapp PRO

# Publica a pasta site/ no GitHub Pages, SÓ quando mandado à mão (Actions,
# Run workflow). O PRO ainda não tem página: antes de usar, ligue o Pages no
# repositório (Settings, Pages, Source: GitHub Actions) e atualize o site/.
# Para publicar a cada mudança em site/, volte o gatilho push:
#   push:
#     branches: [main]
#     paths: ["site/**", ".github/workflows/pages.yml"]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.implantacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: implantacao
        uses: actions/deploy-pages@v4
